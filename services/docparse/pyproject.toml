[project]
name = "docparse"
version = "0.1.0"
description = "Paper (DOCX/PDF) to question-draft service with a deterministic segmenter"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "python-multipart>=0.0.20",
  "pydantic>=2.7",
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
  "python-docx>=1.1",
]

[project.optional-dependencies]
docling = ["docling>=2.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
