services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: { POSTGRES_USER: cbt, POSTGRES_PASSWORD: cbt, POSTGRES_DB: cbt }
    ports: ["5432:5432"]
  valkey:
    image: valkey/valkey:8
    ports: ["6379:6379"]
  seaweedfs:
    image: chrislusf/seaweedfs
    # Dev-only identity (any/any) matches the S3_ACCESS_KEY/S3_SECRET_KEY defaults in packages/config.
    command: "server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data"
    volumes: ["./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro"]
    ports: ["8333:8333"]
  gotenberg:
    image: gotenberg/gotenberg:8
    ports: ["3100:3000"]
  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]
  docparse:
    build: ./services/docparse
    ports: ["8000:8000"]
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
